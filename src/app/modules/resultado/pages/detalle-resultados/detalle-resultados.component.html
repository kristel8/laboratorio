<form [formGroup]="detalleResultadoForm">
  <h2>{{titulo}}</h2>
  <br />
  <h3>Datos de atención</h3>
  <br />
  <section class="container-form t-col-3 t-col-sm-1">
    <div class="form">
      <span class="form-text">Nro Atención:</span>
      <input id="nroOrden" type="text" toUpperCase formControlName="nroOrden" pInputText />
    </div>

    <div class="form">
      <span class="form-text">Apellidos y Nombres:</span>
      <input id="apellidosyNombres" type="text" toUpperCase formControlName="apellidosyNombres" pInputText />
    </div>

    <div class="form">
      <span class="form-text">Fecha:</span>
      <input id="fecha" type="text" toUpperCase formControlName="fecha" pInputText />
    </div>
  </section>

  <br />
  <br />

  <h3>Lista de exámenes</h3>
  <br>
  <section class="container-table">
    <p-table #dt styleClass="p-datatable-striped" [columns]="colsVisibles" [value]="listaDetalleResultado" [rows]="8"
      [paginator]="true" [scrollable]="true" dataKey="idAnalisis" [loading]="isCargado" scrollHeight="400px"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} elementos" [showCurrentPageReport]="true">
      <ng-template pTemplate="caption">
        <div class="caption">
          <span class="caption__search">
            <ng-container>
              Buscar
              <span class="p-input-icon-left">
                <i class="pi pi-search"></i>
                <input pInputText type="text" toUpperCase
                  (input)="dt.filterGlobal($any($event.target).value, 'contains')" />
              </span>
            </ng-container>
          </span>
        </div>
      </ng-template>

      <ng-template pTemplate="header" let-columns>
        <tr>
          <th *ngFor="let col of columns" style="justify-content: center;">
            {{col.header}}
          </th>
          <th pFrozenColumn [frozen]="true" alignFrozen="right" style="justify-content: center;">Opciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-rowData let-columns="columns" let-i="rowIndex">
        <ng-container formArrayName="urocultivos">
          <tr [formGroupName]="i">
            <td *ngFor="let col of columns" style="justify-content: center;">
              <div [ngSwitch]="col.field">
                <div *ngSwitchCase="'estadoAtencionAnalisis'" [value]="rowData[col.field]" appStyleEstado>
                  {{ rowData[col.field] }}
                </div>

                <ng-container *ngSwitchCase="'isUroCultivo'">
                  <div class="group-checkbox" *ngIf="rowData[col.field]">
                    <div class="field-checkbox">
                      <p-radioButton inputId="positivo{{i}}" [value]="1" formControlName="resultadoUroCultivo"
                        [disabled]="rowData.resultadoUroCultivo"></p-radioButton>
                      <label for="positivo{{i}}">Positivo</label>
                    </div>
                    <div class="field-checkbox">
                      <p-radioButton inputId="negativo{{i}}" [value]="2" formControlName="resultadoUroCultivo"
                        [disabled]="rowData.resultadoUroCultivo"></p-radioButton>
                      <label for="negativo{{i}}">Negativo</label>
                    </div>
                  </div>

                  <ng-container *ngIf="!rowData[col.field]">No</ng-container>
                </ng-container>

                <div *ngSwitchDefault>
                  {{ rowData[col.field] }}
                </div>
              </div>
            </td>
            <td class="contain-buttons" pFrozenColumn [frozen]="true" alignFrozen="right">
              <button pButton (click)="agregarResultado(rowData, i)" type="button" icon="pi pi-pencil"
                pTooltip="Editar resultados" class="p-button-rounded p-button-success" [disabled]="rowData.isUroCultivo ? !urocultivos.at(i).get('resultadoUroCultivo')?.value : false"></button>
              <button *ngIf="rowData.estadoAtencionAnalisis === 'COMPLETADO'" pButton (click)="imprimir(rowData, 0)"
                type="button" icon="pi pi-print" pTooltip="Imprimir" class="p-button-rounded p-button-help"></button>
              <button *ngIf="rowData.estadoAtencionAnalisis === 'COMPLETADO'" pButton (click)="imprimir(rowData, 1)"
                type="button" icon="pi pi-send" pTooltip="Enviar WhatsApp" class="p-button-rounded"></button>
            </td>
          </tr>
        </ng-container>
      </ng-template>
    </p-table>

  </section>

</form>
<br>
<div class="container-opciones">
  <app-button [label]="'Regresar'" (eventoClick)="regresar()" [icono]="'pi pi-arrow-left'"
    [estiloBoton]="'p-button-outlined p-button-secondary'"></app-button>
</div>
